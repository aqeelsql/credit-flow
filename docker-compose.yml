x-app-healthcheck-defaults: &app_healthcheck_defaults
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creditflow}
      POSTGRES_USER: ${POSTGRES_USER:-creditflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creditflow-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creditflow} -d ${POSTGRES_DB:-creditflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-creditflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-creditflow-change-me}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10

  auth_service:
    build: ./auth_service
    restart: unless-stopped
    env_file: .env
    environment: &common_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-creditflow}:${POSTGRES_PASSWORD:-creditflow-change-me}@postgres:5432/${POSTGRES_DB:-creditflow}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-creditflow}:${RABBITMQ_DEFAULT_PASS:-creditflow-change-me}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: creditflow.events
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on: &core_depends
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]

  content_service:
    build: ./content_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      CONTENT_UPLOAD_DIR: /app/uploads
    volumes:
      - content_uploads:/app/uploads
    depends_on: *core_depends
    ports:
      - "8003:8003"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3).read()\""]

  user_tenant_service:
    build: ./user_tenant_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
    depends_on: *core_depends
    ports:
      - "8002:8002"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()\""]

  credits_service:
    build: ./credits_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
    depends_on: *core_depends
    ports:
      - "8007:8007"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=3).read()\""]

  admin_service:
    build: ./admin_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      ADMIN_CREDITS_SERVICE_URL: http://credits_service:8007
      ADMIN_USAGE_SERVICE_URL: http://usage_service:8009
      ADMIN_USER_TENANT_SERVICE_URL: http://user_tenant_service:8002
      ADMIN_RABBITMQ_EXCHANGES: creditflow.events,billing_events
    depends_on: *core_depends
    ports:
      - "8008:8008"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=3).read()\""]

  billing_service:
    build: ./billing_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      BILLING_SERVICE_URL: http://billing_service:8006
      BILLING_RABBITMQ_EXCHANGE: billing_events
    depends_on: *core_depends
    ports:
      - "8006:8006"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=3).read()\""]

  usage_service:
    build: ./usage_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      USAGE_SERVICE_URL: http://usage_service:8009
    depends_on: *core_depends
    ports:
      - "8009:8009"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=3).read()\""]

  notification_service:
    build: ./notification_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      NOTIFICATION_RABBITMQ_EXCHANGES: creditflow.events,billing_events
      NOTIFICATION_PUBLISH_EXCHANGE: creditflow.events
    depends_on: *core_depends
    ports:
      - "8013:8013"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/health', timeout=3).read()\""]
      
  scheduler_api:
    build: ./scheduler_service
    restart: unless-stopped
    env_file: .env
    environment: &scheduler_env
      <<: *common_env
      SCHEDULER_CELERY_BROKER_URL: redis://redis:6379/2
      SCHEDULER_CELERY_RESULT_BACKEND: redis://redis:6379/3
      SCHEDULER_LOCK_REDIS_URL: redis://redis:6379/4
      SCHEDULER_EMBEDDED_SCANNER_ENABLED: "false"
    depends_on: *core_depends
    ports:
      - "8004:8004"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3).read()\""]

  scheduler_worker:
    build: ./scheduler_service
    restart: unless-stopped
    env_file: .env
    environment: *scheduler_env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=solo"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler_beat:
    build: ./scheduler_service
    restart: unless-stopped
    env_file: .env
    environment: *scheduler_env
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ai_generation_service:
    build: ./ai_generation_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      REDIS_URL: redis://redis:6379/0
      USAGE_SERVICE_URL: http://usage_service:8009
      AI_GENERATION_QUOTA_BACKEND: usage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      usage_service:
        condition: service_started
    ports:
      - "8010:8010"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).read()\""]

  scraper_service:
    build: ./scraper_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      MONGODB_URL: mongodb://mongodb:27017/creditflow_scraper
      SCRAPER_MONGODB_DATABASE: creditflow_scraper
      SCRAPER_CONTENT_SERVICE_URL: http://content_service:8003
      SCRAPER_CRAWL4AI_BASE_DIRECTORY: /app/.crawl4ai-runtime
    volumes:
      - scraper_runtime:/app/.crawl4ai-runtime
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8012:8012"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=3).read()\""]

  social_publishing_service:
    build: ./social_publishing_service
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      SOCIAL_PUBLISHING_CONTENT_SERVICE_URL: http://content_service:8003
      SOCIAL_PUBLISHING_CONTENT_UPLOAD_DIR: /app/uploads
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://localhost:8005/linkedin/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    volumes:
      - content_uploads:/app/uploads:ro
    depends_on: *core_depends
    ports:
      - "8005:8005"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3).read()\""]

  api_gateway:
    build: ./api_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *common_env
      GATEWAY_AUTH_SERVICE_URL: http://auth_service:8000
      USER_TENANT_SERVICE_URL: http://user_tenant_service:8002
      GATEWAY_CONTENT_SERVICE_URL: http://content_service:8003
      GATEWAY_CALENDAR_SERVICE_URL: http://scheduler_api:8004
      GATEWAY_LINKEDIN_SERVICE_URL: http://social_publishing_service:8005
      BILLING_SERVICE_URL: http://billing_service:8006
      GATEWAY_CREDITS_SERVICE_URL: http://credits_service:8007
      GATEWAY_ADMIN_SERVICE_URL: http://admin_service:8008
      USAGE_SERVICE_URL: http://usage_service:8009
      GATEWAY_AI_GENERATION_SERVICE_URL: http://ai_generation_service:8010
      GATEWAY_SCRAPER_SERVICE_URL: http://scraper_service:8012
    depends_on:
      auth_service:
        condition: service_started
      content_service:
        condition: service_started
      user_tenant_service:
        condition: service_started
      credits_service:
        condition: service_started
      admin_service:
        condition: service_started
      usage_service:
        condition: service_started
      scheduler_api:
        condition: service_started
      social_publishing_service:
        condition: service_started
      billing_service:
        condition: service_started
      ai_generation_service:
        condition: service_started
      scraper_service:
        condition: service_started
    ports:
      - "8000:8080"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()\""]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_USE_LOCAL_AUTH: ${NEXT_PUBLIC_USE_LOCAL_AUTH:-false}
        NEXT_PUBLIC_USE_MOCK_AI: ${NEXT_PUBLIC_USE_MOCK_AI:-false}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_USE_LOCAL_AUTH: ${NEXT_PUBLIC_USE_LOCAL_AUTH:-false}
      NEXT_PUBLIC_USE_MOCK_AI: ${NEXT_PUBLIC_USE_MOCK_AI:-false}
      API_GATEWAY_URL: http://api_gateway:8080
      AUTH_SERVICE_URL: http://auth_service:8000
      USER_TENANT_SERVICE_URL: http://user_tenant_service:8002
      ACCOUNT_SERVICE_URL: http://user_tenant_service:8002
      CONTENT_SERVICE_URL: http://content_service:8003
      BILLING_SERVICE_URL: http://billing_service:8006
      CREDITS_SERVICE_URL: http://credits_service:8007
      ADMIN_SERVICE_URL: http://admin_service:8008
      USAGE_SERVICE_URL: http://usage_service:8009
      SCRAPER_SERVICE_URL: http://scraper_service:8012
      LINKEDIN_SERVICE_URL: http://social_publishing_service:8005
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    depends_on:
      api_gateway:
        condition: service_started
    ports:
      - "3000:3000"
    healthcheck:
      <<: *app_healthcheck_defaults
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongo_data:
  content_uploads:
  scraper_runtime:

